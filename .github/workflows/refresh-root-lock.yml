name: Refresh root lockfile

on:
  push:
    paths:
      - '.github/workflows/refresh-root-lock.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply non-breaking audit fixes to lockfile
        run: npm audit fix --package-lock-only --ignore-scripts
      - name: Install exact graph and verify contracts
        run: |
          npm ci
          npm run compile
          npm test
          npm run deploy:local
          test -s deployments/31337.json
          test -s deployments/31337.frontend.env
      - name: Require zero moderate/high/critical root advisories
        run: npm audit --audit-level=moderate
      - name: Commit lockfile
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "build: refresh patched Hardhat dependency graph"
          git push origin HEAD:main

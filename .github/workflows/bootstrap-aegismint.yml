name: Bootstrap AegisMint source

on:
  push:
    paths:
      - '.bootstrap/AegisMint.tar.gz.b64'

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Expand source tree
        shell: bash
        run: |
          set -euo pipefail
          test -f .bootstrap/AegisMint.tar.gz.b64
          base64 -d .bootstrap/AegisMint.tar.gz.b64 > /tmp/aegismint.tar.gz
          tar -xzf /tmp/aegismint.tar.gz -C .
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap-aegismint.yml
      - name: Commit source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "build: publish AegisMint foundation"
          git push origin HEAD:main

name: One-time test matcher fix

on:
  push:
    paths:
      - '.github/workflows/fix-test-matcher.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update deprecated Hardhat matcher
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("test/AegisMint.test.ts")
          s = p.read_text()
          old = '    await expect(marketplace.connect(other).setMarketplaceFee(100)).to.be.reverted;'
          new = '''    await expect(marketplace.connect(other).setMarketplaceFee(100))
              .to.be.revertedWithCustomError(marketplace, "OwnableUnauthorizedAccount")
              .withArgs(other.address);'''
          if old not in s:
              raise SystemExit("expected deprecated matcher not found")
          p.write_text(s.replace(old, new))
          PY
          rm .github/workflows/fix-test-matcher.yml
      - name: Commit matcher fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test: assert ownable authorization error"
          git push origin HEAD:main

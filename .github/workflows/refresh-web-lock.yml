name: Refresh web lockfile

on:
  push:
    paths:
      - '.github/workflows/refresh-web-lock.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Refresh lockfile
        working-directory: web
        run: npm install --package-lock-only --ignore-scripts
      - name: Install exact graph and build
        working-directory: web
        env:
          NEXT_PUBLIC_SEPOLIA_RPC_URL: https://ethereum-sepolia-rpc.publicnode.com
          NEXT_PUBLIC_NFT_CONTRACT_ADDRESS: 0x0000000000000000000000000000000000000000
          NEXT_PUBLIC_MARKETPLACE_CONTRACT_ADDRESS: 0x0000000000000000000000000000000000000000
          NEXT_PUBLIC_DEPLOYMENT_BLOCK: 0
          NEXT_PUBLIC_PINATA_GATEWAY: example.mypinata.cloud
        run: |
          npm ci
          npm run build
      - name: Require zero high/critical web advisories
        working-directory: web
        shell: bash
        run: |
          npm audit --audit-level=high
      - name: Commit lockfile
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/package-lock.json
          git commit -m "build(web): lock Next.js 16.3.0 dependency graph"
          git push origin HEAD:main

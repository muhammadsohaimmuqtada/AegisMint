name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run compile
      - run: npm test

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
        working-directory: web
      - run: npm run build
        working-directory: web
        env:
          NEXT_PUBLIC_SEPOLIA_RPC_URL: https://ethereum-sepolia-rpc.publicnode.com
          NEXT_PUBLIC_NFT_CONTRACT_ADDRESS: 0x0000000000000000000000000000000000000000
          NEXT_PUBLIC_MARKETPLACE_CONTRACT_ADDRESS: 0x0000000000000000000000000000000000000000
          NEXT_PUBLIC_DEPLOYMENT_BLOCK: 0
          NEXT_PUBLIC_PINATA_GATEWAY: example.mypinata.cloud

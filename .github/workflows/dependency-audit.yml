name: Dependency audit

on:
  push:
    paths:
      - '.github/workflows/dependency-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: |
          npm ci
          npm --prefix web ci
      - name: Collect audit reports
        shell: bash
        run: |
          npm audit --json > root-audit.json || true
          (cd web && npm audit --json > ../web-audit.json) || true
      - name: Print concise advisory summary
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');

          for (const [label, file] of [['ROOT', 'root-audit.json'], ['WEB', 'web-audit.json']]) {
            const report = JSON.parse(fs.readFileSync(file, 'utf8'));
            const meta = report.metadata?.vulnerabilities ?? {};
            console.log(`\n=== ${label} AUDIT ===`);
            console.log(`summary total=${meta.total ?? 0} low=${meta.low ?? 0} moderate=${meta.moderate ?? 0} high=${meta.high ?? 0} critical=${meta.critical ?? 0}`);

            const entries = Object.entries(report.vulnerabilities ?? {})
              .sort((a, b) => {
                const rank = { critical: 4, high: 3, moderate: 2, low: 1, info: 0 };
                return (rank[b[1].severity] ?? 0) - (rank[a[1].severity] ?? 0) || a[0].localeCompare(b[0]);
              });

            for (const [name, vuln] of entries) {
              const via = (vuln.via ?? []).map((item) => typeof item === 'string' ? item : `${item.source}:${item.title}`).join(' | ');
              const fix = vuln.fixAvailable === true
                ? 'yes'
                : vuln.fixAvailable === false
                  ? 'no'
                  : JSON.stringify(vuln.fixAvailable);
              console.log(`${name}\tseverity=${vuln.severity}\tdirect=${Boolean(vuln.isDirect)}\trange=${vuln.range}\tfix=${fix}`);
              if (via) console.log(`  via: ${via}`);
            }
          }
          NODE
